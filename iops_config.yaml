# =============================================================================
# IOPS Configuration - IOR Benchmark (SLURM Cluster)
# =============================================================================
#
# A simple configuration for running IOR benchmarks on a SLURM cluster.
#
# Quick Start:
#   1. Update paths: workdir, output file path in command template
#   2. Update SLURM directives: partition, time limit, modules
#   3. Validate: iops check my_config.yaml
#   4. Dry run:  iops run my_config.yaml --dry-run
#   5. Execute:  iops run my_config.yaml
#
# For a fully documented template with all options, run: iops generate --full
# =============================================================================

benchmark:
  name: "FUnTIDES Lite"
  workdir: "./benchmarks"
  repetitions: 1
  search_method: "exhaustive"
  executor: "local"
  cache_file: "./iops_cache.db"

vars:

  # SEMPROXY variables
  size:
    type: int
    sweep: 
      mode: list
      values: [1]

  # SNAPSHOTS configs
  use_snapshot:
    type: bool
    sweep:
      mode: list
      values: [True]

  snapshot_mode:
    type: str
    sweep:
      mode: list
      values: ["csv"] # csv, binary

  snapshot_header:
    type: str
    sweep:
      mode: list
      values: ["--snapshots-use-headers"]
    when: "use_snapshot"
    default: ""

  snapshot_arg_folder:
    type: str
    sweep:
      mode: list 
      values: ["{{ execution_dir }}/snapshots/"]
    when : "use_snapshot"
    default: ""

  # STDIN
  summary_file:
    type: str
    expr: "{{ execution_dir }}/output.txt"

command:
  template: >
    {% if use_snapshot %}
    semproxy --use-snapshots {% if snapshot_mode == "csv" %} --snapshots-use-csv {% endif %} {{ snapshot_header }} --snapshots-folder {{ snapshot_arg_folder }}
    {% else %}
    semproxy
    {% endif %} 
    
scripts:
  - name: "FUnTIDES-lite"
    script_template: |
      #!/bin/bash

      set -euo pipefail

      # Customize our env
      # #SBATCH --account=your_account
      # export OMP_NUM_THREADS=4
      mkdir {{ snapshot_arg_folder }}
      {{ command.template }} -ex {{ size }} >> {{ summary_file }}

    parser:
      file: "{{ summary_file }}"
      metrics:
        - name: time_init
          type: float
        - name: time_compute
          type: float
        - name: time_total
          type: float
        - name: time_write_snapshot
          type: float
        - name: size_snapshot
          type: float
        - name: number_save_snapshot
          type: int
        - name: time_write_sismos
          type: float
        - name: size_sismos
          type: float
      parser_script: |
        import json
        import os

        def get_sismo_size(path: str) -> int:
          return os.path.getsize(path)

        def get_snapshot_size(path: str) -> int:
          return os.path.getsize(path)

        def parse(file_path: str):
          with open(file_path, "r") as f:
            
            time_init = 0.
            time_compute = 0.
            time_total = 0.

            time_write_snapshot = 0.
            size_snapshot = 0.
            number_save_snapshot = 0.
            time_write_sismos = 0.
            size_sismos = 0.

            lines = f.readlines()

            for line in lines:
              if "Elapsed Initial Time :" in line:
                time_init = float(line.split("Elapsed Initial Time :")[1].strip().rstrip("seconds."))
              elif "Elapsed Compute Time :" in line:
                time_compute = float(line.split("Elapsed Compute Time :")[1].strip().rstrip("seconds."))
              elif "Elapsed TotalExe Time :" in line:
                time_total = float(line.split("Elapsed TotalExe Time :")[1].strip().rstrip("seconds.")) 
              elif "Elapsed Saving Snapshot Time :" in line:
                time_write_snapshot += float(line.split("Elapsed Saving Snapshot Time :")[1].strip().rstrip("seconds."))
                count += 1
              elif "Elapsed Saving Seismos Time :" in line:
                  time_write_sismos = float(line.split("Elapsed Saving Seismos Time :")[1].strip().rstrip("seconds."))
              elif "Snapshot save successfully at :" in line:
                  if (size_snapshot) == 0:
                    snapshot_path = line.split("Snapshot save successfully at :")[1]
                    size_snapshot = get_snapshot_size( {{ snapshot_path }} )
              elif "Sismo save successfully at :" in line:
                  sismos_path = line.split("Sismo save successfully at :")[1]
                  size_sismos = get_sismo_size(f"{ {{ execution_dir }} }/{sismos_path}")

          return {"time_init"    : time_init,
                  "time_compute" : time_compute,
                  "time_total"   : time_total,
                  "time_write_snapshot" : time_write_snapshot,
                  "size_snapshot": size_snapshot,
                  "number_save_snapshot": number_save_snapshot,
                  "time_write_sismos"   : time_write_sismos,
                  "size_sismos"  : size_sismos,
                }

output:
  sink:
    type: csv
    path: "{{ workdir }}/funtides_results.csv"
